# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "pdfoctopus"
version = "0.0.0"
description = "PDFoctopus: eight arms, every PDF job."
authors = ["PDFoctopus contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/AndersonDesign1/pdfoctopus"
edition = "2021"

[lib]
name = "pdfoctopus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Timestamp requests to the two public timestamp servers (src/lib.rs). Rustls with its default
# (ring) crypto and bundled Mozilla root certificates, so nothing depends on the system.
ureq = { version = "3", default-features = false, features = ["rustls"] }
