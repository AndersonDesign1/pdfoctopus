#
# Dependabot opens pull requests to keep dependencies up to date. Minor and patch updates are
# grouped into one weekly PR per ecosystem to keep the noise down; major updates get their
# own PR because they can need code changes. Security fixes are opened as soon as they're
# published, regardless of this schedule (enable "Dependabot security updates" in Settings).
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      js-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Node's types must match the Node version we run (22), so they move together with
      # Node, by hand, rather than whenever a new major is published.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      rust-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
    directory: "/services/convert"
    schedule:
      interval: "weekly"
    groups:
      containers-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/fixtures/scripts"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
